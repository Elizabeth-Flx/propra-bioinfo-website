<form (ngSubmit)="submit()" [formGroup]="form">

  <mat-tab-group (selectedTabChange)="onSelectedTabChange($event)">
    <mat-tab label="Get from Uniprot" value="use-uniprot">
      <div class="task-container">
        <mat-form-field style="width: 100%">
          <mat-label>Get Sequence From UniProt</mat-label>
          <input formControlName="seqfromuniprot" matInput placeholder="Uniprot Accession">
        </mat-form-field>
      </div>
    </mat-tab>
    <mat-tab label="Get from our Database" value="use-our-db">
      <div class="task-container" style="padding-top: 10px">
        <mat-form-field appearance="outline" style="width: 100%">
          <mat-label>Get Sequence from our Database</mat-label>
          <input formControlName="seqfromid" matInput placeholder="Sequence-ID">
        </mat-form-field>
      </div>
    </mat-tab>
    <mat-tab label="Paste sequences as text" value="use-pasted">
      <div class="task-container">
        <mat-form-field style="width: 100%">
          <mat-label>Paste Sequences as text</mat-label>
          <textarea formControlName="pasted" matInput placeholder="Paste Sequence"></textarea>
        </mat-form-field>
      </div>
    </mat-tab>
    <mat-tab label="Upload sequences as fasta" value="use-fasta">
      <div class="task-container" style="width: 100%">
        <h1>Upload Fasta here</h1>
        <input (change)="fileChange($event)" formControlName="fasta" type="file">
      </div>
    </mat-tab>
  </mat-tab-group>
  <button (click)="submit()" class="row-end form-control" color="primary" mat-flat-button matStepperNext>Next</button>
</form>
